<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      
      <a-entity class="fourwheels">  
        <a-entity class="wheels">
          <a-entity position="0 1 0" class="wheel">
              <a-cylinder rotation="90 0 0" color="black"></a-cylinder>
              <a-cylinder position="0 0 0.5" rotation="90 0 0" color="white" radius="0.6" height="0.1"></a-cylinder>
              <a-cylinder position="0 0 0.55" rotation="90 0 0" color="#BADFDB" radius="0.5" height="0.1"></a-cylinder>
              <a-cylinder position="0 0 0.60s" rotation="90 0 0" color="#FFBDBD" radius="0.2" height="0.1"></a-cylinder>
          </a-entity>
          <a-entity position="8 1 0" class="wheel">
              <a-cylinder rotation="90 0 0" color="black"></a-cylinder>
              <a-cylinder position="0 0 0.5" rotation="90 0 0" color="white" radius="0.6" height="0.1"></a-cylinder>
              <a-cylinder position="0 0 0.55" rotation="90 0 0" color="#BADFDB" radius="0.5" height="0.1"></a-cylinder>
              <a-cylinder position="0 0 0.60s" rotation="90 0 0" color="#FFBDBD" radius="0.2" height="0.1"></a-cylinder>
          </a-entity>
        </a-entity>
        <a-entity class="wheels" position="5 0 -5" rotation="0 180 0">
          <a-entity position="-3 1 0" class="wheel">
              <a-cylinder rotation="90 0 0" color="black"></a-cylinder>
              <a-cylinder position="0 0 0.5" rotation="90 0 0" color="white" radius="0.6" height="0.1"></a-cylinder>
              <a-cylinder position="0 0 0.55" rotation="90 0 0" color="#BADFDB" radius="0.5" height="0.1"></a-cylinder>
              <a-cylinder position="0 0 0.60s" rotation="90 0 0" color="#FFBDBD" radius="0.2" height="0.1"></a-cylinder>
          </a-entity>
          <a-entity position="5 1 0" class="wheel">
              <a-cylinder rotation="90 0 0" color="black"></a-cylinder>
              <a-cylinder position="0 0 0.5" rotation="90 0 0" color="white" radius="0.6" height="0.1"></a-cylinder>
              <a-cylinder position="0 0 0.55" rotation="90 0 0" color="#BADFDB" radius="0.5" height="0.1"></a-cylinder>
              <a-cylinder position="0 0 0.60s" rotation="90 0 0" color="#FFBDBD" radius="0.2" height="0.1"></a-cylinder>
          </a-entity>
        </a-entity>
      </a-entity>

      <a-entity class="wheelframe">

        <a-entity class="frame">
          <a-entity position="0 .7 0" color="#F2EBE2">
            <a-torus scale=".9" radius-tubular="0.08" position="0 0 0" arc="180" radius="1.5">
              <a-sphere position="1.5 0 0" radius="0.16"></a-sphere>
              <a-sphere position="-1.5 0 0" radius="0.16"></a-sphere>
            </a-torus>

          <a-entity position="0 0 -5" color="#F2EBE2">
            <a-torus scale=".9" radius-tubular="0.08" position="0 0 0" arc="180" radius="1.5">
              <a-sphere position="1.5 0 0" radius="0.16"></a-sphere>
              <a-sphere position="-1.5 0 0" radius="0.16"></a-sphere>
            </a-torus>
          </a-entity>
        </a-entity>

        <a-entity class="frame2" position="8 0 0">
          <a-entity position="0 0.7 0" color="#F2EBE2">
            <a-torus scale=".9" radius-tubular="0.08" position="0 0 0" arc="180" radius="1.5">
              <a-sphere position="1.5 0 0" radius="0.16"></a-sphere>
              <a-sphere position="-1.5 0 0" radius="0.16"></a-sphere>
            </a-torus>
          </a-entity>

          <a-entity position="0 0.7 -5" color="#F2EBE2">
            <a-torus scale=".9" radius-tubular="0.08" position="0 0 0" arc="180" radius="1.5">
              <a-sphere position="1.5 0 0" radius="0.16"></a-sphere>
              <a-sphere position="-1.5 0 0" radius="0.16"></a-sphere>
            </a-torus>
          </a-entity>
             
      </a-entity>



        </a-entity>
      </a-entity>



      <a-cylinder position="4 0.7 0"rotation="90 0 90" radius="0.15" height="5.2"></a-cylinder>
      <a-cylinder position="4 0.7 -5"rotation="90 0 90" radius="0.15" height="5.2"></a-cylinder>
      <a-entity class="front frame">
        <a-cylinder position="-2.4 0.7 0"rotation="90 0 90" radius="0.15" height="2.2">
          <a-sphere position="0 1.1 0"radius="0.15"> </a-sphere>
        </a-cylinder>
        <a-cylinder position="-2.4 0.7 -5"rotation="90 0 90" radius="0.15" height="2.2"><a-sphere position="0 1.1 0"radius="0.15"> </a-sphere>
        </a-cylinder>
        <a-cylinder position="-3.5 0.7 -2.5"rotation="90 0 0" radius="0.15" height="5"></a-cylinder>
      </a-entity>

      <a-entity class="back frame" position="8 0 -5" rotation="0 180 0">
        <a-cylinder position="-2.4 0.7 0"rotation="90 0 90" radius="0.15" height="2.2">
          <a-sphere position="0 1.1 0"radius="0.15"> </a-sphere>
        </a-cylinder>
        <a-cylinder position="-2.4 0.7 -5"rotation="90 0 90" radius="0.15" height="2.2"><a-sphere position="0 1.1 0"radius="0.15"> </a-sphere>
        </a-cylinder>
        <a-cylinder position="-3.5 0.7 -2.5"rotation="90 0 0" radius="0.15" height="5"></a-cylinder>
      </a-entity>


      
      
      




      <a-plane position="0 0 -4" rotation="-90 0 0" width="100" height="100" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
      <a-camera position="3 2 10"></a-camera>
    </a-scene>
  </body>
</html>
